[project]
name = "forge-cli"
version = "0.1.0"
description = "Forge command-line interface"
requires-python = ">=3.12"
dependencies = [
    "forge-core",
    "typer[all]>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
forge = "forge.cli.main:app"

[tool.hatch.build.targets.wheel]
only-include = ["forge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
