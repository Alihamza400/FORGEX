[project]
name = "forge-core"
version = "0.1.0"
description = "Core library for Forge — multi-agent AI platform runtime, auth, LLM client, memory, orchestration, and tools"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Forge Contributors" }]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "redis[hiredis]>=5.0,<6.0",
    "qdrant-client>=1.9,<2.0",
    "minio>=7.2,<8.0",
    "structlog>=24.0,<25.0",
    "orjson>=3.10,<4.0",
    "prometheus-client>=0.20,<1.0",
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2.0",
    "opentelemetry-semantic-conventions>=0.46b0,<1.0",
]

[project.urls]
Homepage = "https://github.com/Alihamza400/FORGEX"
Repository = "https://github.com/Alihamza400/FORGEX"
Documentation = "https://github.com/Alihamza400/FORGEX"

[tool.hatch.build.targets.wheel]
packages = ["forge"]
include = ["forge/py.typed"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
