[project]
name = "forge-api"
version = "0.1.0"
description = "REST API server for Forge — self-hosted multi-agent AI platform"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Forge Contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "forge-core>=0.1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "bcrypt>=4.0,<6.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.46b0,<1.0",
    "python-multipart>=0.0.32",
]

[project.urls]
Homepage = "https://github.com/Alihamza400/FORGEX"
Repository = "https://github.com/Alihamza400/FORGEX"
Documentation = "https://github.com/Alihamza400/FORGEX"

[project.scripts]
forge-api = "forge.api.main:main"

[tool.hatch.build.targets.wheel]
only-include = ["forge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
