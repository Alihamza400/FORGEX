[project]
name = "forge-api"
version = "0.1.0"
description = "Forge REST API server"
requires-python = ">=3.12"
dependencies = [
    "forge-core",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "bcrypt>=4.0,<6.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0,<1.0",
    "opentelemetry-instrumentation-httpx>=0.46b0,<1.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["forge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
