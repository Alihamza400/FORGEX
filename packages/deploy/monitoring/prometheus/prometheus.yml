global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "forge-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["forge-api:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "forge-api"

  - job_name: "postgres"
    static_configs:
      - targets: ["forge-postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["forge-redis-exporter:9121"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
