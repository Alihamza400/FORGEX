apiVersion: v1
kind: ResourceQuota
metadata:
  name: forge-resource-quota
  namespace: forge
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    persistentvolumeclaims: 20
    pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: forge-limit-range
  namespace: forge
spec:
  limits:
  - default:
      memory: 512Mi
      cpu: 500m
    defaultRequest:
      memory: 256Mi
      cpu: 250m
    type: Container
