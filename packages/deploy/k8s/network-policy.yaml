apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-default-deny-all
  namespace: forge
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-allow-dns-egress
  namespace: forge
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-allow-intra-stack
  namespace: forge
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 5432
    - port: 6333
    - port: 6334
    - port: 6379
    - port: 9000
    - port: 11434
    - port: 8000
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-allow-api-ingress
  namespace: forge
spec:
  podSelector:
    matchLabels:
      app: forge-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-allow-egress-to-ollama
  namespace: forge
spec:
  podSelector:
    matchLabels:
      app: forge-api
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: forge-ollama
    ports:
    - port: 11434
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: forge-postgres
    ports:
    - port: 5432
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: forge-qdrant
    ports:
    - port: 6333
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: forge-redis
    ports:
    - port: 6379
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: forge-minio
    ports:
    - port: 9000
      protocol: TCP
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
