apiVersion: v1
kind: Secret
metadata:
  name: forge-secrets
  namespace: forge
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
type: Opaque
stringData:
  # ⚠ WARNING: Replace these with secure values before production use
  postgres-password: CHANGEME_postgres_secret
  minio-access-key: CHANGEME_forge
  minio-secret-key: CHANGEME_minio_secret
  forge-api-key: CHANGEME_generate_with_openssl_rand_hex_32
---
apiVersion: v1
kind: Secret
metadata:
  name: forge-tls
  namespace: forge
type: kubernetes.io/tls
stringData:
  tls.crt: ""
  tls.key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: forge-ca
  namespace: forge
type: Opaque
stringData:
  ca.crt: ""
