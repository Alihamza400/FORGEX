apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-ollama
  namespace: forge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forge-ollama
  template:
    metadata:
      labels:
        app: forge-ollama
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
          name: api
        env:
        - name: OLLAMA_KEEP_ALIVE
          value: "24h"
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
          readOnly: false
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "8Gi"
            cpu: "2"
          limits:
            memory: "16Gi"
            cpu: "4"
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: forge-ollama-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forge-ollama-models
  namespace: forge
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: forge-ollama
  namespace: forge
spec:
  ports:
  - port: 11434
    targetPort: 11434
  selector:
    app: forge-ollama
