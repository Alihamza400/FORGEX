name: forge

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    container_name: forge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forge}
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - forge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-forge}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - forge-net

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.12.0}
    container_name: forge-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - forge-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - forge-net

  redis:
    image: redis:${REDIS_VERSION:-7}-alpine
    container_name: forge-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - forge-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - forge-net

  minio:
    image: minio/minio:${MINIO_VERSION:-latest}
    container_name: forge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-forge_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - forge-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - forge-net

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: forge-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - forge-ollama-data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - forge-net

  # ── Observability ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.53.0}
    container_name: forge-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - forge-prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - forge-net

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.3.0}
    container_name: forge-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-forge}
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - forge-grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - forge-net
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_VERSION:-0.108.0}
    container_name: forge-otel-collector
    command: ["--config=/etc/otel/config.yml"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_METRICS_PORT:-8889}:8889"
    volumes:
      - ./monitoring/otel-collector:/etc/otel
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:4317"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - forge-net

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.6.0}
    container_name: forge-tempo
    command: ["-config.file=/etc/tempo/config.yml"]
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
      - "${TEMPO_GRPC_PORT:-9095}:9095"
    volumes:
      - forge-tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - forge-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:${PG_EXPORTER_VERSION:-v0.15.0}
    container_name: forge-postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge_secret}@postgres:5432/${POSTGRES_DB:-forge}?sslmode=disable
    ports:
      - "${PG_EXPORTER_PORT:-9187}:9187"
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - forge-net
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:${REDIS_EXPORTER_VERSION:-v1.62.0}
    container_name: forge-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9121/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - forge-net
    depends_on:
      redis:
        condition: service_healthy

volumes:
  forge-postgres-data:
  forge-qdrant-data:
  forge-redis-data:
  forge-minio-data:
  forge-ollama-data:
  forge-prometheus-data:
  forge-grafana-data:
  forge-tempo-data:

networks:
  forge-net:
    driver: bridge
