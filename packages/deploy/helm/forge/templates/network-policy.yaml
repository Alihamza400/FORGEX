{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-default-deny-all
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-allow-dns-egress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-allow-intra-stack
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: {{ .Values.postgresql.service.port }}
    - port: {{ .Values.qdrant.service.httpPort }}
    - port: {{ .Values.qdrant.service.grpcPort }}
    - port: {{ .Values.redis.service.port }}
    - port: {{ .Values.minio.service.apiPort }}
    - port: {{ .Values.ollama.service.port }}
    - port: {{ .Values.api.service.port }}
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-allow-api-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - port: {{ .Values.api.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-allow-api-egress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: postgresql
    ports:
    - port: {{ .Values.postgresql.service.port }}
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: qdrant
    ports:
    - port: {{ .Values.qdrant.service.httpPort }}
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: redis
    ports:
    - port: {{ .Values.redis.service.port }}
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: minio
    ports:
    - port: {{ .Values.minio.service.apiPort }}
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: ollama
    ports:
    - port: {{ .Values.ollama.service.port }}
      protocol: TCP
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
{{- end }}
