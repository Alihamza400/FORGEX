{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-ollama
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    {{- include "forge.component" (dict "component" "ollama") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "forge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        {{- include "forge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      securityContext:
        {{- toYaml .Values.ollama.securityContext | nindent 8 }}
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ollama
        image: "{{ include "forge.image" (dict "root" . "imageSpec" .Values.ollama.image) }}"
        imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.ollama.service.port }}
          name: api
        env:
        - name: OLLAMA_KEEP_ALIVE
          value: {{ .Values.ollama.keepAlive | quote }}
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
        livenessProbe:
          httpGet:
            path: /api/tags
            port: {{ .Values.ollama.service.port }}
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/tags
            port: {{ .Values.ollama.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          {{- toYaml .Values.ollama.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: forge-ollama-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forge-ollama-models
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    {{- include "forge.component" (dict "component" "ollama") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.ollama.persistence.storageClass }}
  storageClassName: {{ .Values.ollama.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ollama.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: forge-ollama
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "forge.labels" . | nindent 4 }}
    {{- include "forge.component" (dict "component" "ollama") | nindent 4 }}
spec:
  ports:
  - port: {{ .Values.ollama.service.port }}
    targetPort: {{ .Values.ollama.service.port }}
  selector:
    {{- include "forge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
{{- end }}
