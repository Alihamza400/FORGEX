[project]
name = "forge-mcp-filesystem"
version = "0.1.0"
description = "MCP server for filesystem operations"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
forge-mcp-filesystem = "forge_mcp_filesystem.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["forge_mcp_filesystem"]
