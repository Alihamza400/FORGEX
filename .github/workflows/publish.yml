name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
      - "forge-core-v*.*.*"
      - "forge-cli-v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Determine package to publish
        id: package
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == forge-core-* ]]; then
            echo "name=forge-core" >> $GITHUB_OUTPUT
            echo "dir=packages/core" >> $GITHUB_OUTPUT
            echo "version=${TAG#forge-core-}" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == forge-cli-* ]]; then
            echo "name=forge-cli" >> $GITHUB_OUTPUT
            echo "dir=packages/cli" >> $GITHUB_OUTPUT
            echo "version=${TAG#forge-cli-}" >> $GITHUB_OUTPUT
          else
            echo "name=all" >> $GITHUB_OUTPUT
            echo "dir=." >> $GITHUB_OUTPUT
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Sync versions
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          if [ "${{ steps.package.outputs.name }}" = "all" ]; then
            sed -i "s/^version = .*/version = \"$VERSION\"/" packages/core/pyproject.toml
            sed -i "s/^version = .*/version = \"$VERSION\"/" packages/cli/pyproject.toml
          else
            sed -i "s/^version = .*/version = \"$VERSION\"/" ${{ steps.package.outputs.dir }}/pyproject.toml
          fi

      - name: Build package
        run: |
          if [ "${{ steps.package.outputs.name }}" = "all" ]; then
            uv build --package forge-core
            uv build --package forge-cli
          else
            uv build --package ${{ steps.package.outputs.name }}
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: |
            ${{ steps.package.outputs.dir == '.' && 'packages/core/dist packages/cli/dist' || format('{0}/dist', steps.package.outputs.dir) }}
